<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DefSpend — Defense Contract Intelligence</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg2:#0d1017;--bg3:#121520;--bg4:#181c28;--bg5:#1e2334;
  --border:#ffffff0e;--border2:#ffffff18;
  --text:#dde2f0;--text2:#7e8aaa;--text3:#454e68;
  --blue:#4f8ef7;--blue2:#0f2a5c;--blue3:#1a3a7a;
  --green:#22d47a;--green2:#0a2e1a;
  --amber:#f5a623;--amber2:#3a2200;
  --red:#f05252;--purple:#a78bfa;--purple2:#1e1040;
  --orange:#fb923c;--teal:#2dd4bf;
  --canada:#d52b1e;--canada2:#3a0a08;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:13px;line-height:1.5;overflow-x:hidden}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse-ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.4);opacity:0}}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;height:48px;border-bottom:1px solid var(--border2);background:var(--bg);position:sticky;top:0;z-index:300;padding:0 16px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo-mark{width:26px;height:26px;border-radius:5px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.logo-mark i{color:#fff;font-size:14px}
.logo-text{font-size:15px;font-weight:700;color:var(--text)}
.logo-tld{color:var(--text3);font-weight:400;font-size:12px}

/* Country tabs */
.ctabs{display:flex;gap:3px;flex-shrink:0}
.ctab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:.15s}
.ctab:hover{background:var(--bg4);color:var(--text)}
.ctab.usa-active{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.ctab.canada-active{background:var(--canada2);color:var(--canada);border-color:#d52b1e55}
.ctab.map-active{background:var(--purple2);color:var(--purple);border-color:#a78bfa55}

/* Sub nav */
.subnav{display:flex;gap:1px;flex:1;overflow-x:auto}
.snl{padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--text2);font-size:11px;border:none;background:none;transition:.12s;white-space:nowrap;display:flex;align-items:center;gap:3px}
.snl:hover{background:var(--bg4);color:var(--text)}
.snl.active{background:var(--bg4);font-weight:500}
.snl.usa-sub{color:var(--blue)}
.snl.canada-sub{color:var(--canada)}

.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green2);border:1px solid #22d47a22;color:var(--green);font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
.ref-btn{display:flex;align-items:center;gap:5px;background:var(--blue2);color:var(--blue);border:1px solid var(--blue3);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:600}
.ref-btn:hover{background:var(--blue);color:#fff}

/* Ticker */
.ticker-tape{background:var(--bg2);border-bottom:1px solid var(--border);height:30px;overflow:hidden;display:flex;align-items:center}
.ticker-inner{display:flex;animation:scroll 50s linear infinite;white-space:nowrap}
.ticker-inner:hover{animation-play-state:paused}
.tick-item{display:flex;align-items:center;gap:5px;padding:0 16px;border-right:1px solid var(--border);font-size:11px;cursor:pointer}

/* Hero */
.hero{border-bottom:1px solid var(--border2);padding:14px 20px 0}
.bignum{font-size:36px;font-weight:800;letter-spacing:-2px;line-height:1}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);margin-top:10px}
.kpi{padding:9px 14px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi .k-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.kpi .k-val{font-size:17px;font-weight:700}
.kpi .k-d{font-size:10px;margin-top:1px}
.up{color:var(--green)}.dn{color:var(--red)}

/* AI bar */
.ai-bar{display:flex;gap:8px;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--bg);align-items:center}
.ai-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 12px;color:var(--text);font-size:12px;outline:none}
.ai-input:focus{border-color:var(--blue)}
.ai-input::placeholder{color:var(--text3)}
.ai-btn{background:var(--blue2);color:var(--blue);border:1px solid var(--blue3);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.ai-btn:hover{background:var(--blue);color:#fff}
.xls-btn{background:#14532d;color:#22d47a;border:1px solid #22d47a33;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.xls-btn:hover{background:#22d47a;color:#000}
.ai-result{margin:0 20px 6px;background:var(--bg3);border-left:2px solid var(--blue);border-radius:6px;padding:10px 14px;font-size:12px;line-height:1.8;color:var(--text2);display:none}
.ai-result.show{display:block}
.ai-load{display:none;padding:4px 20px;font-size:11px;color:var(--text3);align-items:center;gap:6px}
.ai-load.show{display:flex}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}

/* Main layout */
.main-layout{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 48px - 30px - 98px - 36px);overflow:hidden}
.center{overflow-y:auto}
.sidebar{overflow-y:auto;border-left:1px solid var(--border);background:var(--bg2)}

/* Search panel */
.search-panel{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
.sp-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sp-input{flex:1;min-width:130px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;outline:none}
.sp-input:focus{border-color:var(--blue)}
.sp-input::placeholder{color:var(--text3)}
.sp-select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 7px;color:var(--text);font-size:11px;outline:none;cursor:pointer}
.sp-btn{background:var(--blue2);color:var(--blue);border:1px solid var(--blue3);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px}
.sp-btn:hover{background:var(--blue);color:#fff}
.sp-status{font-size:10px;color:var(--text3)}
.sp-pages{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pg{padding:2px 7px;border-radius:3px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:10px;cursor:pointer}
.pg:hover{background:var(--bg4)}
.pg.active{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}

/* Sub-tab bar */
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{padding:7px 12px;cursor:pointer;color:var(--text2);font-size:11px;font-weight:500;border-bottom:2px solid transparent;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Table */
.tbl-wrap{padding:0 16px}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 0 4px}
.tbl-title{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);padding:4px 7px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.data-table td{padding:6px 7px;border-bottom:1px solid var(--border);font-size:11px;vertical-align:middle}
.data-table tr.cl{cursor:pointer}
.data-table tr.cl:hover td{background:var(--bg3)}
.co-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:5px}
.pill{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:500;white-space:nowrap;display:inline-block}
.p-green{background:var(--green2);color:var(--green)}
.p-amber{background:var(--amber2);color:var(--amber)}
.p-blue{background:var(--blue2);color:var(--blue)}
.p-red{background:var(--canada2);color:var(--canada)}
.amt{font-weight:600;color:var(--text);white-space:nowrap}
.tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--text3);display:inline-block}

/* Canada cards */
.ca-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px 16px}
.ca-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:.15s;border-left:3px solid var(--canada)}
.ca-card:hover{border-color:var(--canada);background:var(--bg4)}

/* Stocks */
.stock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 16px}
.stock-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px;cursor:pointer;transition:.15s}
.stock-card:hover{border-color:var(--border2);background:var(--bg4)}

/* Compare */
.compare-wrap{padding:12px 16px}
.co-select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;outline:none;cursor:pointer;min-width:140px}
.cmp-btn{background:var(--blue2);color:var(--blue);border:1px solid var(--blue3);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:11px}
.cmp-btn:hover{background:var(--blue);color:#fff}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cmp-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.cs{background:var(--bg3);padding:8px 10px}
.cs .cv{font-size:13px;font-weight:700}
.cs .cl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}

/* Map */
.map-view{position:relative;height:calc(100vh - 48px - 30px - 98px - 36px)}
#worldMap{width:100%;height:100%}
.leaflet-container{background:#07090f!important}
.map-ctrl-panel{position:absolute;top:10px;left:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-ctrl-box{background:#0d1017ee;border:1px solid var(--border2);border-radius:8px;padding:10px;backdrop-filter:blur(8px)}
.map-layer-btn{padding:4px 9px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px;width:100%;margin-bottom:3px}
.map-layer-btn:last-child{margin-bottom:0}
.map-layer-btn:hover{background:var(--bg4);color:var(--text)}
.map-layer-btn.active{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.map-sidebar{position:absolute;top:10px;right:10px;width:265px;background:#0d1017ee;border:1px solid var(--border2);border-radius:10px;padding:14px;z-index:500;backdrop-filter:blur(8px);max-height:calc(100% - 20px);overflow-y:auto}
.map-prompt{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;color:var(--text);font-size:11px;outline:none;margin-top:6px}
.map-prompt:focus{border-color:var(--blue)}
.pchip{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);cursor:pointer;white-space:nowrap}
.pchip:hover{background:var(--bg3);color:var(--text)}
.map-tip{position:fixed;background:#0d1017;border:1px solid var(--border2);border-radius:6px;padding:7px 11px;font-size:11px;pointer-events:none;display:none;z-index:2000}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:#000000bb;z-index:1000;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:600px;max-height:85vh;overflow-y:auto;padding:20px}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px}
.mstat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.mstat{background:var(--bg3);border-radius:6px;padding:9px 11px;border:1px solid var(--border)}
.mstat .mv{font-size:14px;font-weight:700}
.mstat .ml{font-size:9px;color:var(--text3);margin-top:1px;text-transform:uppercase;letter-spacing:.6px}
.modal-sec{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin:10px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* Sidebar */
.sb-block{padding:10px 12px;border-bottom:1px solid var(--border)}
.sb-title{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.co-row{display:flex;align-items:center;gap:6px;padding:4px;cursor:pointer;border-radius:4px}
.co-row:hover{background:var(--bg4)}
.rv-row{padding:5px 0;border-bottom:1px solid var(--border)}
.rv-row:last-child{border-bottom:none}
.al-row{display:flex;gap:6px;padding:4px 0}
.src-link{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--blue);text-decoration:none;padding:4px 7px;background:var(--bg3);border-radius:5px;margin-bottom:3px}
.src-link:hover{background:var(--bg4)}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="#"><div class="logo-mark"><i class="ti ti-shield-bolt"></i></div><span class="logo-text">DefSpend<span class="logo-tld">.com</span></span></a>

  <div class="ctabs">
    <button class="ctab usa-active" id="ctab-usa" onclick="setCountry('usa')">🇺🇸 USA</button>

    <button class="ctab" id="ctab-map" onclick="setCountry('map')">🌍 Global Map</button>
  </div>

  <div class="subnav" id="subnav"></div>

  <div class="topbar-right">
    <div class="live-badge"><span class="dot"></span>Live</div>

</div>

<div id="heroWrap"></div>

<div class="ai-bar">

  <button class="ai-btn" onclick="runAI()"><i class="ti ti-sparkles" style="font-size:11px"></i>Analyze</button>
  <button class="xls-btn" onclick="exportExcel()"><i class="ti ti-file-spreadsheet" style="font-size:11px"></i>Excel</button>
</div>
<div class="ai-load" id="aiLoad"><span class="spinner"></span><span style="margin-left:6px">Analyzing…</span></div>
<div class="ai-result" id="aiRes"></div>

<div class="main-layout">
  <div class="center" id="centerPane"></div>
  <div class="sidebar">
    <div class="sb-block">
      <div class="sb-title" id="sbSectorTitle">Sector Breakdown</div>

      <div id="sbSectorLegend" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px"></div>

    <div class="sb-block"><div class="sb-title">Alerts</div><div id="sbAlerts"></div></div>
    <div class="sb-block">
      <div class="sb-title">Data Sources</div>
      <a class="src-link" href="https://www.usaspending.gov" target="_blank"><i class="ti ti-external-link" style="font-size:10px"></i>USASpending.gov</a>
      <a class="src-link" href="https://sam.gov" target="_blank"><i class="ti ti-external-link" style="font-size:10px"></i>SAM.gov</a>
      <a class="src-link" href="https://buyandsell.gc.ca" target="_blank"><i class="ti ti-external-link" style="font-size:10px"></i>BuyAndSell.gc.ca 🇨🇦</a>
      <a class="src-link" href="https://www.defense.gov/News/Contracts/" target="_blank"><i class="ti ti-external-link" style="font-size:10px"></i>Pentagon Daily</a>
      <a class="src-link" href="https://finnhub.io" target="_blank"><i class="ti ti-external-link" style="font-size:10px"></i>Finnhub Stocks</a>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="map-tip" id="mapTip2"></div>

<script>

function fmt(v){if(!v||isNaN(v))return'—';if(v>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(0)+'M';return'$'+Math.round(v).toLocaleString();}
function aCol(a){if(!a)return'#555e75';if(a.includes('ARMY'))return'#4ade80';if(a.includes('NAVY'))return'#60a5fa';if(a.includes('AIR'))return'#fb923c';if(a.includes('DARPA'))return'#a78bfa';return'#2dd4bf';}
function aShort(a){if(!a)return'DoD';if(a.includes('ARMY'))return'Army';if(a.includes('NAVY'))return'Navy';if(a.includes('AIR'))return'USAF';if(a.includes('DARPA'))return'DARPA';return'DoD';}
function toast(msg,color){const t=document.createElement('div');t.style.cssText=`position:fixed;bottom:20px;right:20px;background:#0d1017;border:1px solid ${color};border-left:3px solid ${color};border-radius:8px;padding:10px 16px;font-size:12px;color:${color};z-index:9999;max-width:340px`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(()=>t.remove(),400)},3500);}
function tip2(html,ev){const t=document.getElementById('mapTip2');t.style.display='block';t.style.left=(ev.originalEvent.clientX+12)+'px';t.style.top=(ev.originalEvent.clientY-28)+'px';t.innerHTML=html;}
function hideTip2(){document.getElementById('mapTip2').style.display='none';}

function setCountry(c){
  country=c;

  // Update country tab styles
  document.getElementById('ctab-usa').className='ctab'+(c==='usa'?' usa-active':'');
  document.getElementById('ctab-canada').className='ctab'+(c==='canada'?' canada-active':'');
  document.getElementById('ctab-map').className='ctab'+(c==='map'?' map-active':'');

  // Build subnav + hero + center
  if(c==='usa') buildUSA();
  else if(c==='canada') buildCanada();
  else buildMap();

  // Sidebar
  renderSidebar();
  updateSectorChart();
}

function setUSAView(v,btn){
  usaView=v;

  renderUSAView(v);
}

function renderUSAView(v){
  const cp=document.getElementById('centerPane');
  if(v==='search') cp.innerHTML=buildSearchHTML();
  else if(v==='contracts') cp.innerHTML=buildContractsHTML();
  else if(v==='rfp') cp.innerHTML=buildRFPsHTML();
  else if(v==='companies') cp.innerHTML=buildCompaniesHTML();
  else if(v==='compare') cp.innerHTML=buildCompareHTML();
  else if(v==='stocks') cp.innerHTML=buildStocksHTML();
  else if(v==='rivalries') cp.innerHTML=buildRivalriesHTML();

  // attach events after render
  setTimeout(()=>{
    const lsInput=document.getElementById('lsKey');
    if(lsInput) lsInput.addEventListener('keydown',e=>{if(e.key==='Enter')liveSearch(1);});
    if(v==='stocks') renderStockGrid();
    if(v==='compare'){populateSelects();runCompare();}
  },50);
}

// MAP ENGINE
// ═══════════════════════════════════════════════
function initWorldMap(){
  if(worldMap){worldMap.invalidateSize();return;}
  worldMap=L.map('worldMap',{center:[25,10],zoom:3,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(worldMap);
  L.control.zoom({position:'bottomleft'}).addTo(worldMap);
  renderAllMapLayers();
}

function clearMapMarkers(){
  mapMarkers.forEach(m=>{try{m.remove()}catch(e){}});
  mapMarkers=[];
  swellIntervals.forEach(clearInterval);
  swellIntervals=[];
}

function renderAllMapLayers(){
  clearMapMarkers();
  if(activeLayers.supply)renderSupplyLayer();
  if(activeLayers.conflict)renderConflictLayer();
  if(activeLayers.bases)renderBasesLayer();
  if(activeLayers.stocks)renderSwellsLayer();
}

function renderSupplyLayer(){
  tradeRoutes.forEach(r=>{
    if(r.type==='import'&&!activeLayers.fmf)return;
    const color=r.type==='import'?'#22d47a':r.color;
    const weight=r.fmf>10000?3:r.fmf>3000?2:1.5;
    const dash=r.type==='import'?'4,8':'8,5';
    const arc=L.polyline([r.from,r.to],{color,weight,opacity:r.type==='import'?0.5:0.8,dashArray:dash}).addTo(worldMap);
    arc.on('click',()=>showMapRouteSidebar(r));
    arc.on('mouseover',ev=>tip2(`<strong style="color:${color}">${r.label}</strong><br>${r.value}`,ev));
    arc.on('mousemove',ev=>tip2(`<strong style="color:${color}">${r.label}</strong><br>${r.value}`,ev));
    arc.on('mouseout',hideTip2);
    mapMarkers.push(arc);
    const icon=L.divIcon({html:`<div style="width:7px;height:7px;border-radius:50%;background:${color};box-shadow:0 0 5px ${color}66"></div>`,className:'',iconSize:[7,7]});
    const m=L.marker(r.from,{icon}).addTo(worldMap);
    m.on('click',()=>showMapRouteSidebar(r));
    mapMarkers.push(m);
    if(r.type==='export'||r.type==='both'){
      const dot=L.circleMarker(r.from,{radius:2.5,color:r.color,fillColor:r.color,fillOpacity:1,weight:0}).addTo(worldMap);
      mapMarkers.push(dot);
      let t=Math.random();
      const anim=()=>{t+=0.003;if(t>1)t=0;dot.setLatLng([r.from[0]+(r.to[0]-r.from[0])*t,r.from[1]+(r.to[1]-r.from[1])*t]);requestAnimationFrame(anim);};
      requestAnimationFrame(anim);
    }
  });
  [{lat:61.52,lng:105.32,n:"Russia",c:"#f05252"},{lat:32.43,lng:53.69,n:"Iran",c:"#f05252"},{lat:40.34,lng:127.51,n:"N.Korea",c:"#f05252"},{lat:35.86,lng:104.19,n:"China",c:"#f5a623"}].forEach(z=>{
    const icon=L.divIcon({html:`<div style="width:14px;height:14px;border-radius:2px;background:${z.c};display:flex;align-items:center;justify-content:center;font-size:8px">🚫</div>`,className:'',iconSize:[14,14]});
    const m=L.marker([z.lat,z.lng],{icon}).addTo(worldMap);
    m.on('mouseover',ev=>tip2(`<strong style="color:${z.c}">${z.n}</strong><br>🚫 Arms embargo / restrictions`,ev));
    m.on('mousemove',ev=>tip2(`<strong style="color:${z.c}">${z.n}</strong><br>🚫 Arms embargo / restrictions`,ev));
    m.on('mouseout',hideTip2);
    mapMarkers.push(m);
  });
}

function renderConflictLayer(){
  conflictZones.forEach(z=>{
    const icon=L.divIcon({html:`<div style="position:relative;width:14px;height:14px"><div style="width:14px;height:14px;border-radius:50%;background:${z.color};box-shadow:0 0 10px ${z.color}88"></div><div style="position:absolute;inset:-5px;border-radius:50%;border:2px solid ${z.color};animation:pulse-ring 2s ease-out infinite;opacity:.4"></div></div>`,className:'',iconSize:[14,14]});
    const m=L.marker([z.lat,z.lng],{icon}).addTo(worldMap);
    m.on('click',()=>showMapConflictSidebar(z));
    m.on('mouseover',ev=>tip2(`<strong style="color:${z.color}">${z.name}</strong><br>${z.level}`,ev));
    m.on('mousemove',ev=>tip2(`<strong style="color:${z.color}">${z.name}</strong><br>${z.level}`,ev));
    m.on('mouseout',hideTip2);
    mapMarkers.push(m);
  });
}

function renderBasesLayer(){
  usBases.forEach(b=>{
    const icon=L.divIcon({html:`<div style="width:10px;height:10px;background:#4f8ef7;clip-path:polygon(50% 0%,100% 100%,0% 100%)"></div>`,className:'',iconSize:[10,10]});
    const m=L.marker([b.lat,b.lng],{icon}).addTo(worldMap);
    m.on('mouseover',ev=>tip2(`<strong style="color:var(--blue)">${b.name}</strong><br>${b.country} · ${b.personnel.toLocaleString()} personnel`,ev));
    m.on('mousemove',ev=>tip2(`<strong style="color:var(--blue)">${b.name}</strong><br>${b.country}`,ev));
    m.on('mouseout',hideTip2);
    mapMarkers.push(m);
  });
}

function renderSwellsLayer(){
  [[38,-97,'#4f8ef7'],[31.77,35.21,'#22d47a'],[49,32,'#f05252'],[23.7,120.9,'#a78bfa'],[35.7,139.7,'#e8c84a']].forEach(([lat,lng,color])=>{
    const circle=L.circle([lat,lng],{radius:700000,color,fillColor:color,fillOpacity:.06,weight:.5}).addTo(worldMap);
    mapMarkers.push(circle);
    let growing=true;
    const iv=setInterval(()=>{const r=circle.getRadius();growing?circle.setRadius(r*1.015):circle.setRadius(r*.985);if(r>1100000)growing=false;if(r<500000)growing=true;},120);
    swellIntervals.push(iv);
  });
}

function toggleLayer(btn,layer){
  btn.classList.toggle('active');
  activeLayers[layer]=!activeLayers[layer];
  renderAllMapLayers();
}

function mapFocus(focus,btn){

async function fetchStocks(){
  for(const c of usaCompanies){
    if(c.ticker.includes('.'))continue;
    try{
      const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${c.ticker}&token=${FINNHUB}`);
      const d=await r.json();
      if(d.c&&d.c>0)stockPrices[c.ticker]={price:d.c,chg:+(d.c-d.pc).toFixed(2),pct:+(((d.c-d.pc)/d.pc)*100).toFixed(2),open:d.o,high:d.h,low:d.l,prev:d.pc};
    }catch(e){}
  }
  renderTicker();
  renderLiveStockMini();
  const sg=document.getElementById('stockGrid');
  if(sg)renderStockGrid();
}

function renderTicker(){
  const items=usaCompanies.map(c=>{
    const s=stockPrices[c.ticker];
    if(!s)return`<div class="tick-item"><span style="font-weight:700;color:${c.color}">${c.ticker}</span><span style="color:var(--text3);font-size:10px"> …</span></div>`;
    const up=s.chg>=0;
    return`<div class="tick-item"><span style="font-weight:700;color:${c.color}">${c.ticker}</span><span style="font-size:12px;font-weight:600;color:${c.color}"> $${s.price.toFixed(2)}</span><span style="font-size:10px;color:${up?'var(--green)':'var(--red)'}"> ${up?'▲':'▼'}${Math.abs(s.pct).toFixed(2)}%</span></div>`;
  }).join('');
  document.getElementById('ticker').innerHTML=items+items;
}

function renderLiveStockMini(){
  const el=document.getElementById('liveStockMini');if(!el)return;
  el.innerHTML=usaCompanies.slice(0,5).map(c=>{
    const s=stockPrices[c.ticker];const up=s?s.chg>=0:true;
    return`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:10px;font-weight:700;color:${c.color};min-width:28px">${c.ticker}</span>
      <div style="flex:1;height:3px;background:var(--bg4);border-radius:2px"><div style="width:${s?Math.min(100,50+s.pct*8):50}%;height:3px;background:${c.color};border-radius:2px;transition:width 1s"></div></div>
      <span style="font-size:10px;color:${up?'var(--green)':'var(--red)'};min-width:36px;text-align:right">${s?'$'+s.price.toFixed(0):'—'}</span>
    </div>`;
  }).join('');
}

function renderStockGrid(){
  const sg=document.getElementById('stockGrid');if(!sg)return;
  sg.innerHTML=usaCompanies.map((c,i)=>{
    const s=stockPrices[c.ticker];

// LIVE SEARCH
// ═══════════════════════════════════════════════
async function liveSearch(page){
  page=page||1;
  const kw=document.getElementById('lsKey')?.value.trim()||'';
  const ag=document.getElementById('lsAgency')?.value||'';
  const yr=(document.getElementById('lsYear')?.value||'2025-01-01|2026-05-22').split('|');
  const sort=document.getElementById('lsSort')?.value||'Award Amount';
  const tbody=document.getElementById('lsTbody');
  const status=document.getElementById('spStatus');
  if(!tbody)return;
  tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:18px"><span class="spinner"></span><span style="color:var(--text3);margin-left:8px">Querying USASpending.gov…</span></td></tr>`;
  if(status)status.innerHTML=`<span class="spinner"></span> Connecting…`;
  try{
    const filters={award_type_codes:["A","B","C","D"],agencies:[{type:"awarding",tier:"toptier",name:ag||"Department of Defense"}],time_period:[{start_date:yr[0],end_date:yr[1]}]};
    if(kw)filters.keywords=[kw];
    const r=await fetch('https://api.usaspending.gov/api/v2/search/spending_by_award/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters,fields:["Award ID","Recipient Name","Award Amount","Awarding Agency","Description","Action Date"],sort,order:"desc",limit:50,page})});
    const d=await r.json();const res=d.results||[];const total=d.page_metadata?.total||res.length;
    csvData=res;const tp=Math.min(Math.ceil(total/50),200);
    if(status)status.innerHTML=`<i class="ti ti-check" style="color:var(--green);font-size:11px"></i> <strong style="color:var(--amber)">${total.toLocaleString()} contracts found</strong> <span style="color:var(--text3)">· page ${page}/${tp}</span>`;
    if(!res.length){tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:18px;color:var(--text3)">No contracts found.</td></tr>`;const pp=document.getElementById('spPages');if(pp)pp.innerHTML='';return;}
    tbody.innerHTML=res.map(c=>{
      const v=c['Recipient Name']||'';const desc=c['Description']||'';const ag2=c['Awarding Agency']||'';const amt=c['Award Amount']||0;const dt=c['Action Date']||'';const id=c['Award ID']||'';
      const url=id?`https://www.usaspending.gov/award/${encodeURIComponent(id)}/`:`https://www.usaspending.gov/search/?keywords=${encodeURIComponent(v)}`;
      return`<tr class="cl" onclick="window.open('${url}','_blank')"><td><span class="co-dot" style="background:${aCol(ag2)}"></span><strong style="font-size:11px">${v.slice(0,26)}</strong></td><td style="color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">${desc.slice(0,50)}</td><td><span class="tag" style="color:${aCol(ag2)}">${aShort(ag2)}</span></td><td class="amt">${fmt(amt)}</td><td style="color:var(--text3);font-size:11px">${dt?dt.slice(0,10):''}</td><td><span class="pill p-green">Awarded</span></td></tr>`;
    }).join('');
    const pp=document.getElementById('spPages');if(!pp)return;
    const pg=[];
    if(page>1)pg.push(`<button class="pg" onclick="liveSearch(${page-1})">‹</button>`);
    for(let i=Math.max(1,page-2);i<=Math.min(tp,page+2);i++)pg.push(`<button class="pg${i===page?' active':''}" onclick="liveSearch(${i})">${i}</button>`);
    if(page<tp)pg.push(`<button class="pg" onclick="liveSearch(${page+1})">›</button>`);
    pp.innerHTML=pg.join('');
  }catch(e){
    if(status)status.innerHTML=`<span style="color:var(--amber)">⚠ API error — try again</span>`;
    if(tbody)tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:18px;color:var(--text3)">Could not reach USASpending.gov.</td></tr>`;
  }
}

async function askAI(question,targetId){
  const el=document.getElementById(targetId);if(!el)return;
  el.style.display='block';el.innerHTML='<span class="spinner"></span> Analyzing…';
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    const d=await r.json();
    if(d.answer){
      const f=d.answer.replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--text)">$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
      el.innerHTML=`<span style="font-size:10px;color:var(--blue);display:flex;align-items:center;gap:4px;margin-bottom:6px"><i class="ti ti-sparkles" style="font-size:10px"></i> AI Analysis</span>${f}`;
    } else throw new Error('no answer');
  }catch(e){el.innerHTML='<span style="color:var(--amber)">Analysis unavailable</span>';}
}

  btn.disabled=false;btn.style.opacity='1';icon.style.animation='';
  fetchStocks();
}

function renderSidebar(){

  } else {
    document.getElementById('sbComp').innerHTML=usaCompanies.slice(0,6).map(c=>`<div class="co-row" onclick="openModal('${c.name}')"><div style="width:20px;height:20px;border-radius:3px;background:${c.color}22;color:${c.color};display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;flex-shrink:0">${c.ticker.slice(0,2)}</div><div style="font-size:11px;flex:1;font-weight:500">${c.name.split(' ')[0]}</div><div style="width:44px;height:3px;background:var(--bg5);border-radius:2px"><div style="width:${c.pct}%;height:3px;border-radius:2px;background:${c.color}"></div></div><div style="font-size:10px;font-weight:600;min-width:38px;text-align:right;color:${c.color}">${c.fy24}</div></div>`).join('');
  }
  document.getElementById('sbRiv').innerHTML=rivalries.slice(0,4).map(r=>`<div class="rv-row"><span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--purple2);color:var(--purple);float:right">${r.stage}</span><div style="font-size:11px;font-weight:500;color:var(--text);margin-bottom:2px">${r.prog}</div><div style="font-size:10px;color:var(--text2)">${r.a} <span style="color:var(--text3)">vs</span> ${r.b}</div></div>`).join('');
  document.getElementById('sbAlerts').innerHTML=alerts.map(a=>`<div class="al-row"><div style="width:5px;height:5px;border-radius:50%;background:${a.color};flex-shrink:0;margin-top:4px"></div><div><div style="font-size:11px;color:var(--text)">${a.text}</div><div style="font-size:9px;color:var(--text3)">${a.time}</div></div></div>`).join('');
}

function updateSectorChart(){

  document.getElementById('sbSectorTitle').textContent=isCA?'🇨🇦 DND Sector Breakdown':'🇺🇸 Sector Breakdown';
  if(sectorChartInst)sectorChartInst.destroy();
  const el=document.getElementById('sectorChart');
  if(isCA){
    sectorChartInst=new Chart(el,{type:'doughnut',data:{labels:['Naval','Aviation','Land','Space/ISR','C4ISR'],datasets:[{data:[47,28,13,8,4],backgroundColor:['#60a5fa','#fb923c','#4ade80','#a78bfa','#2dd4bf'],borderWidth:0,hoverOffset:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'70%'}});
    document.getElementById('sbSectorLegend').innerHTML=['#60a5fa:Naval 47%','#fb923c:Aviation 28%','#4ade80:Land 13%','#a78bfa:Space 8%'].map(s=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text2)"><span style="width:6px;height:6px;border-radius:2px;background:${s.split(':')[0]};display:inline-block"></span>${s.split(':')[1]}</span>`).join('');

    document.getElementById('sbSectorLegend').innerHTML=['#fb923c:Aviation','#4ade80:Land','#60a5fa:Naval','#a78bfa:C4ISR','#f472b6:Missiles'].map(s=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text2)"><span style="width:6px;height:6px;border-radius:2px;background:${s.split(':')[0]};display:inline-block"></span>${s.split(':')[1]}</span>`).join('');

function exportExcel(){
  const usaData=csvData.length?csvData.map(c=>({'Vendor':c['Recipient Name']||'','Description':c['Description']||'','Agency':c['Awarding Agency']||'','Amount ($)':c['Award Amount']||0,'Date':c['Action Date']||''})):usaFallback.map(c=>({'Vendor':c.vendor,'Description':c.desc,'Agency':c.agency,'Amount ($)':c.amount,'Date':c.date}));
  const caData=canadaContracts.map(c=>({'Contractor':c.vendor,'Program':c.program,'Value':c.value,'Client':c.client,'Status':c.status}));
  const xml=buildXML([
    {name:'USA DoD Contracts',headers:Object.keys(usaData[0]),rows:usaData.map(r=>Object.values(r))},
    {name:'Canada DND Contracts',headers:Object.keys(caData[0]),rows:caData.map(r=>Object.values(r))},
    {name:'USA Top Contractors',headers:['Company','Ticker','FY24','Contracts','YoY','Sector'],rows:usaCompanies.map(c=>[c.name,c.ticker,c.fy24,c.contracts,c.trend,c.sector])},
    {name:'Canada Programs',headers:['Program','Badge','Value','Description'],rows:canadaPrograms.map(p=>[p.name,p.badge,p.value,p.desc])},
    {name:'USA Open RFPs',headers:['Title','Agency','Value','Deadline','Stage'],rows:usaRfps.map(r=>[r.title,r.agency,r.val,r.deadline,r.stage])},
    {name:'Canada Procurement',headers:['Program','Dept','Value','Deadline','Stage'],rows:canadaRfps.map(r=>[r.program,r.dept,r.value,r.deadline,r.stage])},
  ]);
  const a=document.createElement('a');a.href='data:application/vnd.ms-excel;charset=utf-8,'+encodeURIComponent(xml);a.download=`DefSpend_${TODAY}.xls`;a.click();
  toast('✓ Excel exported — 6 sheets (USA + Canada)','#22d47a');
}

function exportCompanyExcel(name){
  const c=usaCompanies.find(x=>x.name===name);if(!c)return;
  const s=stockPrices[c.ticker];
  const xml=buildXML([{name:c.name.slice(0,31),headers:['Metric','Value'],rows:[['Company',c.name],['Ticker',c.ticker],['Sector',c.sector],['FY2022 ($B)',c.fy[0]],['FY2023 ($B)',c.fy[1]],['FY2024 ($B)',c.fy[2]],['Contracts',c.contracts],['YoY',c.trend],['Live Stock',s?'$'+s.price.toFixed(2):'N/A'],['Programs',c.programs.join(', ')]]}]);
  const a=document.createElement('a');a.href='data:application/vnd.ms-excel;charset=utf-8,'+encodeURIComponent(xml);a.download=`DefSpend_${c.ticker}_${TODAY}.xls`;a.click();
  toast(`✓ ${c.name} exported`,'#22d47a');
}

function buildXML(sheets){
  const st=`<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#4F8EF7"/><Interior ss:Color="#0F2A5C" ss:Pattern="Solid"/></Style><Style ss:ID="e"><Interior ss:Color="#121520" ss:Pattern="Solid"/><Font ss:Color="#DDE2F0"/></Style><Style ss:ID="o"><Interior ss:Color="#0D1017" ss:Pattern="Solid"/><Font ss:Color="#DDE2F0"/></Style></Styles>`;
  const ws=sheets.map(s=>`<Worksheet ss:Name="${s.name.slice(0,31)}"><Table><Row>${s.headers.map(h=>`<Cell ss:StyleID="h"><Data ss:Type="String">${h}</Data></Cell>`).join('')}</Row>${s.rows.map((r,i)=>`<Row>${r.map(v=>`<Cell ss:StyleID="${i%2===0?'e':'o'}"><Data ss:Type="${typeof v==='number'?'Number':'String'}">${String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`).join('');
  return`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${st}${ws}</Workbook>`;
}

name: Daily DefSpend Refresh
on:
  schedule:
    - cron: '0 7 * * *'  # tous les jours à 7h UTC
  workflow_dispatch:      # bouton manuel aussi

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
